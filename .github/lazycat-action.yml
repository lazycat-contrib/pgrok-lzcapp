version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/pgrok.lpk
  target_arch: amd64
update:
  strategy: publish
  sync_license: true
  allow_downgrade: false
  version_source:
    type: image
    image: pgrok
build:
  run_buildscript: false
images:
- id: pgrok
  target: service
  service: pgrok
  source: ghcr.io/pgrok/pgrokd
  channel: stable
  sort: semver
  tag_regex: ^v?\d+\.\d+\.\d+$
  delivery:
    mode: mirror
    require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: pgrok
    summary: 自托管安全隧道服务
